name: Orbit Settings
slug: orbit-settings
summary: Define typed settings classes and manage them visually in Orbit panels.
description: |
  ## What it does

  Pair typed `almasix.settings.Settings` classes with Orbit `SettingsPage`
  forms. The plugin registers those pages on your panel, loads and saves through
  Conduit, encrypts sensitive properties with Almasix `Crypt`, and respects
  panel tenancy for tenant-scoped settings.

  ## Install

  ```bash
  pip install almasix-settings almasix-orbit-settings
  smith migrate
  ```

  ```python
  from almasix_orbit_settings import SettingsPlugin

  panel.plugin(
      SettingsPlugin.make()
      .navigation_group("Settings")
      .pages([ManageGeneralSettings])
  )
  ```

  Optional Redis repository: `pip install almasix-settings[redis]`.

  Full README: [almasix-orbit-settings](https://github.com/almasix-dev/almasix-orbit-settings).
