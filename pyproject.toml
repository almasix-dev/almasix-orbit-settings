[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-orbit-settings"
version = "0.1.0"
description = "Orbit plugin — manage typed Almasix settings in the panel"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]
readme = "README.md"
dependencies = [
    "almasix-orbit>=0.5.2",
    "almasix-settings>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff==0.16.6",
]

[project.entry-points."almasix.providers"]
orbit_settings = "almasix_orbit_settings.provider:OrbitSettingsProvider"

[project.urls]
Homepage = "https://github.com/almasix-dev/almasix-orbit-settings"
Documentation = "https://orbit.almasix.com/plugins/orbit-settings/"
Repository = "https://github.com/almasix-dev/almasix-orbit-settings"
Issues = "https://github.com/almasix-dev/almasix-orbit-settings/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix_orbit_settings"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/almasix_orbit_settings",
    "/tests",
    "/examples",
    "/marketplace",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["almasix_orbit_settings"]
omit = [
    "*/almasix_orbit_settings/commands.py",
    "*/almasix_orbit_settings/provider.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
